# 站点全局配置。改这里即可，无需动代码。

# 站点基础信息(用于 SEO / 页脚 / RSS / 结构化数据)
site:
  name: "LINVIN_"
  title: "LINVIN'S BLOG"
  description: "一位 MC 玩家的技术博客：储电红石、开发的思考笔记。"
  author: "Linvin"
  locale: "zh-CN"
  # 正式域名(会被环境变量 NEXT_PUBLIC_SITE_URL 覆盖)
  url: "https://blog.linvin.net"
  postsPerPage: 6
  latestCountOnHome: 4

# 页脚版权。{year} 会被替换为当前年份
copyright: "© {year} Linvin"

# 首页 INTRO 区与关于页的社交外链
social:
  - label: "GITHUB_PROFILE"
    url: "https://github.com/Linvin-1233"
  - label: "MY_BILIBILI"
    url: "https://space.bilibili.com/3546703521122448"

# 关于页内容(markdown 语法)
about: |
  你好！我是 Linvin，一位 MC 玩家，对**储电**稍有研究。

  对全栈、Web 开发也稍有钻研。

# Gitalk 评论(基于 GitHub Issues)。
# 使用前需：1) 建一个用于存评论的 GitHub 仓库；2) 建一个 GitHub OAuth App
# (Authorization callback URL 填站点域名)。
# clientID / clientSecret 放在环境变量里(见 .env.example)，不写进本文件、不进 git。
# 注意：Gitalk 机制决定这两个值最终仍会出现在前端 JS 中，仅访问者可见级别的“公开”。
gitalk:
  enable: true
  repo: "Blog-talk"
  owner: "Linvin-1233"
  admin:
    - "Linvin-1233"
